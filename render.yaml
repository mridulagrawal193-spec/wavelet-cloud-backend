services:
  - type: web
    name: wavelet-cloud-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: STORAGE_MODE
        value: local
      - key: OWNER_API_SECRET
        generateValue: true
